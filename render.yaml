services:
  - type: web
    name: gym-tracking-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --ignore-scripts && npm run contracts:build && npm run build --workspace=@gym-tracking/api
    startCommand: node apps/api/dist/server.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
